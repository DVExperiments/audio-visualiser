# Builds the Windows installer and portable app on GitHub's Windows machines, so nobody needs
# PowerShell, Node.js or .NET on their own PC.
#
#   Publish a release on GitHub (Releases › Draft a new release › tag e.g. v0.20.0 › Publish):
#     ~10 minutes later the Setup .exe and the Portable .exe are attached to that release.
#   Or: Actions › "Build installer" › Run workflow: the .exe files appear under the run's Artifacts.
#
# Code signing (optional): add repository secrets SIGN_PFX_BASE64 (the .pfx, base64) and
# SIGN_PFX_PASSWORD; without them the packages are built unsigned. See docs/RELEASE.md.
name: Build installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # to attach the .exe files to the release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test, build the audio service and package
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          if ($env:SIGN_PFX_BASE64) { $env:CSC_LINK = $env:SIGN_PFX_BASE64; $env:CSC_KEY_PASSWORD = $env:SIGN_PFX_PASSWORD }
          ./scripts/package.ps1

      - name: Keep the installers (Actions › this run › Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: audio-visualisation-studio-windows
          path: apps/desktop-electron/dist/*.exe
          if-no-files-found: error

      - name: Attach the installers to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem apps/desktop-electron/dist -Filter *.exe | ForEach-Object { $_.FullName }
          gh release upload "${{ github.event.release.tag_name }}" $files --clobber
